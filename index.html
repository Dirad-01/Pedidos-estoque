<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pedidos de Materiais</title>

    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- TOAST -->

    <div id="toastContainer" class="toast-container"></div>

    <!-- CONTAINER -->

    <main class="container">

        <!-- HEADER -->

        <div class="top-bar">

            <div>

                <h1>Pedidos de Materiais</h1>

                <p class="subtitle">
                    Busque materiais, adicione quantidades e gere os dados rapidamente.
                </p>

            </div>

            <div class="stats">

                <div class="stat-card">

                    <span>Total Itens</span>

                    <strong id="itemCounter">0</strong>

                </div>

                <div class="stat-card">

                    <span>Última Geração</span>

                    <strong id="lastGenerated">--:--</strong>

                </div>

            </div>

        </div>

        <!-- SEARCH -->

        <div class="search-wrapper">

            <input type="text" id="searchBar" class="search-bar"
                placeholder="Buscar materiais..." autocomplete="off" />

            <div class="search-info">

                <span id="resultsCount">0 resultados</span>

            </div>

        </div>

        <!-- RESULTADOS -->

        <div id="loading" class="loading">

            <div class="loader"></div>

            <span>Carregando materiais...</span>

        </div>

        <ul id="resultList" class="result-list"></ul>

        <!-- SECTION -->

        <div class="section-header">

            <h2>Materiais Adicionados</h2>

            <button id="clearList" class="clear-button">

                Limpar Lista

            </button>

        </div>

        <ul id="addedList" class="added-list"></ul>

        <!-- ACTIONS -->

        <div class="actions">

            <button id="generateData" class="generate-button">

                Gerar Dados

            </button>

        </div>

    </main>

    <!-- MODAL -->

    <div id="dataModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Dados dos Pedidos</h2>

                <button id="closeModal" class="close-button">

                    ✕

                </button>

            </div>

            <div id="dataContainer"></div>

            <button id="copyButton" class="copy-button">

                Copiar Dados

            </button>

        </div>

    </div>

    <!-- FOOTER -->

    <footer>

        © 2024–2026 Victor Duarte. Todos os direitos reservados.

    </footer>

    <!-- SCROLL -->

    <button id="scrollTopBtn" title="Voltar ao topo">

        ↑

    </button>

    <script src="script.js"></script>

</body>

</html>
